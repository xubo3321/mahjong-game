<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雀悦麻将 · 四人麻将（单机/联机）</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="sys-banner" class="sys-banner hidden"></div>

  <!-- ========== 登录 / 注册 ========== -->
  <section id="screen-auth" class="screen">
    <div class="auth-card">
      <h1 class="logo">🀄 雀悦麻将</h1>
      <p class="sub">四人麻将 · 单机对战机器人 / 联机开房</p>
      <div class="tabs">
        <button id="tab-login" class="tab active" data-tab="login">登录</button>
        <button id="tab-register" class="tab" data-tab="register">注册</button>
      </div>
      <form id="form-login" class="auth-form">
        <input id="login-email" type="email" placeholder="邮箱" required>
        <input id="login-password" type="password" placeholder="密码" required>
        <button type="submit" class="btn primary">登录</button>
        <div id="login-error" class="error-msg"></div>
      </form>
      <form id="form-register" class="auth-form hidden">
        <input id="reg-username" type="text" placeholder="游戏昵称" maxlength="12" required>
        <input id="reg-email" type="email" placeholder="邮箱" required>
        <input id="reg-password" type="password" placeholder="密码（至少6位）" minlength="6" required>
        <input id="reg-invite" type="text" placeholder="邀请码（选填）" maxlength="8">
        <button type="submit" class="btn primary">注册并进入</button>
        <div id="register-error" class="error-msg"></div>
      </form>
      <div class="offline-tip">
        <button id="btn-offline" class="btn ghost">🚀 离线体验（无需注册，仅单机）</button>
        <p class="tip-text">配置 Supabase 后即可使用注册 / 联机 / 邀请 / 云端计分</p>
      </div>
    </div>
  </section>

  <!-- ========== 大厅 ========== -->
  <section id="screen-lobby" class="screen hidden">
    <header class="topbar">
      <span class="logo-sm">🀄 雀悦麻将</span>
      <div class="user-box">
        <span id="lobby-username">玩家</span>
        <span id="lobby-chips" class="chips">💰 0</span>
        <button id="btn-logout" class="btn ghost sm">退出</button>
      </div>
    </header>
    <main class="lobby-main">
      <div class="lobby-grid">
        <div class="lobby-card">
          <h2>🎯 单机模式</h2>
          <p>与 3 个机器人同桌，本地即时开局</p>
          <div id="single-rule-summary" class="rule-summary"></div>
          <button id="btn-single-rules" class="btn ghost">⚙️ 规则设置</button>
          <button id="btn-single-start" class="btn primary">开始游戏</button>
        </div>
        <div class="lobby-card">
          <h2>🌐 联机模式</h2>
          <p>创建房间邀请好友，4 人同意规则后开局</p>
          <div class="row">
            <button id="btn-create-room" class="btn primary">创建房间</button>
            <input id="join-code" placeholder="房间号" maxlength="6">
            <button id="btn-join-room" class="btn">加入房间</button>
          </div>
          <div id="join-error" class="error-msg"></div>
          <div id="invite-box" class="invite-box hidden">
            <h3>📣 我的邀请码</h3>
            <div class="invite-code-row">
              <span id="my-invite-code" class="invite-code">——</span>
              <button id="btn-copy-invite" class="btn ghost sm">复制邀请链接</button>
            </div>
            <p class="tip-text">好友注册时填写你的邀请码，双方都可获得金币奖励</p>
          </div>
        </div>
        <div class="lobby-card wide">
          <h2>📊 战绩</h2>
          <div id="standings-box" class="standings"><p class="tip-text">完成牌局后这里显示总战绩</p></div>
        </div>
      </div>
    </main>
  </section>

  <!-- ========== 牌桌 ========== -->
  <section id="screen-game" class="screen hidden">
    <div id="rotate-hint">↻ 竖屏可玩，旋转到横屏体验更佳</div>
    <header class="game-topbar">
      <span id="game-title">牌局</span>
      <span id="round-info" class="round-info"></span>
      <div class="game-actions">
        <button id="btn-view-rules" class="btn ghost sm">规则</button>
        <button id="btn-standings" class="btn ghost sm">计分</button>
        <button id="btn-toggle-chat" class="btn ghost sm">💬 聊天</button>
        <button id="btn-quit" class="btn ghost sm">离开</button>
      </div>
    </header>

    <div id="table" class="table">
      <!-- 四个座位：0=自己(下) 1=下家(右) 2=对家(上) 3=上家(左) -->
      <div id="seat-2" class="seat seat-top">
        <div class="seat-info"><span class="seat-name"></span><span class="seat-score"></span><span class="seat-mark"></span></div>
        <div class="seat-melds"></div>
        <div class="river"></div>
      </div>
      <div id="seat-3" class="seat seat-left">
        <div class="seat-info"><span class="seat-name"></span><span class="seat-score"></span><span class="seat-mark"></span></div>
        <div class="seat-melds"></div>
        <div class="river river-vert"></div>
      </div>
      <div id="seat-1" class="seat seat-right">
        <div class="seat-info"><span class="seat-name"></span><span class="seat-score"></span><span class="seat-mark"></span></div>
        <div class="seat-melds"></div>
        <div class="river river-vert"></div>
      </div>
      <div id="center" class="center">
        <div id="center-info">
          <div id="wall-count"></div>
          <div id="turn-hint"></div>
          <div id="last-discard" class="last-discard"></div>
        </div>
      </div>
    </div>

    <div id="my-area" class="my-area">
      <div id="my-seat-info" class="my-seat-info"></div>
      <div id="my-melds" class="seat-melds"></div>
      <div id="action-bar" class="action-bar"></div>
      <div id="my-hand" class="my-hand"></div>
    </div>

    <!-- 开局前：房间等待 / 同意规则 -->
    <div id="room-overlay" class="room-overlay hidden">
      <div class="room-panel">
        <h2 id="room-panel-title">房间</h2>
        <div class="room-code-row">
          房间号：<span id="room-code-display" class="invite-code">——</span>
          <button id="btn-copy-room" class="btn ghost sm">复制房间链接</button>
        </div>
        <div id="room-players" class="room-players"></div>
        <div id="room-rules-view" class="room-rules-view"></div>
        <div class="room-btns">
          <button id="btn-agree-rules" class="btn primary">✅ 同意规则并准备</button>
          <button id="btn-add-bot" class="btn hidden">➕ 补一个机器人</button>
          <button id="btn-start-room" class="btn primary hidden">🀄 开始对局</button>
        </div>
        <div id="room-status" class="tip-text"></div>
      </div>
    </div>

    <!-- 聊天 / 弹幕抽屉 -->
    <div id="chat-drawer" class="chat-drawer hidden">
      <div class="chat-head">💬 聊天弹幕 <button id="btn-close-chat" class="btn ghost sm">×</button></div>
      <div id="chat-list" class="chat-list"></div>
      <div class="quick-phrases" id="quick-phrases"></div>
      <div class="chat-input-row">
        <input id="chat-input" placeholder="发个弹幕…" maxlength="60">
        <button id="btn-send-chat" class="btn primary sm">发送</button>
      </div>
    </div>

    <div id="danmaku-layer"></div>
  </section>

  <div id="modal-root"></div>
</div>

<script src="config.js"></script>
<script src="tiles.js"></script>
<script src="rules.js"></script>
<script src="engine.js"></script>
<script src="bot.js"></script>
<script src="net.js"></script>
<script src="app.js"></script>
</body>
</html>
